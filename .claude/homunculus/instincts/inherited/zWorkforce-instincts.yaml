# Python naming

## Action

Use `snake_case` for Python files, functions, methods, and variables;
`PascalCase` for classes; and `UPPER_SNAKE_CASE` for constants.

## Evidence

- The `zworkforce/` package and `tests/` suite follow standard Python naming.

