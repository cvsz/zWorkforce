# Package boundaries

## Action

Follow the local instructions and toolchain for the component being changed:
Python service at the root, .NET under `ZWorkforceClient/`, and Z.A.R.V.I.S.
under `packages/zarvis/`.

## Evidence

- The repository is a polyglot monorepo with independently tested components.

