<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>zider Quick Settings</title>
  <style>
    body {
      width: 260px;
      padding: 12px;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .title {
      font-weight: bold;
      color: #38bdf8;
      font-size: 14px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .btn {
      width: 100%;
      background: #38bdf8;
      color: #09090b;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ zider AI</div>
    <span style="font-size:10px;color:#71717a;">v1.0</span>
  </div>
  <div class="status">
    <div class="dot"></div>
    <span>Gateway Connected (8085)</span>
  </div>
  <button id="toggle-btn" class="btn">Open Sidebar (Ctrl+M)</button>
  <script src="popup.js"></script>
</body>
</html>
