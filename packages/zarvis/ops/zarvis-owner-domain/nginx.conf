worker_processes 1;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 16m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:ZARVIS:2m;
  ssl_session_timeout 10m;
  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  server { listen 127.0.0.1:8443 ssl default_server; server_name _; return 444; }

  server {
    listen 127.0.0.1:8443 ssl;
    server_name zarvis.zeaz.dev action.zarvis.zeaz.dev;
    add_header X-ZARVIS-Exposure "owner-ssh-loopback-only" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For 127.0.0.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://127.0.0.1:8098;
    }
  }

  server {
    listen 127.0.0.1:8443 ssl;
    server_name proactive.zarvis.zeaz.dev;
    add_header X-ZARVIS-Exposure "owner-ssh-loopback-only" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For 127.0.0.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://127.0.0.1:8099;
    }
  }

  server {
    listen 127.0.0.1:8443 ssl;
    server_name voice.zarvis.zeaz.dev;
    add_header X-ZARVIS-Exposure "owner-ssh-loopback-only" always;
    add_header X-ZARVIS-Inference "local-only" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /v1/realtime {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For 127.0.0.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_pass http://127.0.0.1:8450;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For 127.0.0.1;
      proxy_pass http://127.0.0.1:3023;
    }
  }
}
