apiVersion: control.zeaz.dev/v1alpha1
kind: ZControlConfig

project:
  name: zarvis
  repository: cvsz/zWorkforce
  defaultBranch: main

runtime:
  provider: docker-compose
  composeFile: compose.zarvis-local.yml
  projectName: zarvis
  healthTimeout: 180s

profiles:
  local:
    environmentFile: .env
    allowPurge: true
  staging:
    environmentFile: .env.staging
    allowPurge: false
  production:
    environmentFile: .env.production
    allowPurge: false

audit:
  enabled: true
  directory: .zctl/audit
  redactEnvironment: true
