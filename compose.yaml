services:
  zworkforce:
    build: .
    image: zworkforce:1.0.0
    restart: unless-stopped
    env_file: [.env]
    ports: ["9569:9569"]
    volumes: ["zworkforce-data:/var/lib/zworkforce","./workspace:/workspace"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
volumes:
  zworkforce-data:
