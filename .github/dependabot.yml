version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
  - package-ecosystem: nuget
    directory: /ZWorkforceClient
    schedule:
      interval: monthly
      day: monday
      time: "05:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, windows-client]
  - package-ecosystem: npm
    directory: /packages/zarvis
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 10
    labels: [dependencies, zarvis]
  - package-ecosystem: pip
    directory: /packages/zarvis/apps/zaicoder/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, python, zarvis]
  - package-ecosystem: pip
    directory: /packages/zarvis/services/zarvis-api
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, python, zarvis]
  - package-ecosystem: pip
    directory: /packages/zarvis/services/zc
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, python, zarvis]
  - package-ecosystem: gomod
    directory: /packages/zarvis/tools/zctl
    schedule:
      interval: monthly
      day: monday
      time: "06:45"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, go, zarvis]
  - package-ecosystem: nuget
    directory: /packages/zarvis/apps/zarvis-windows
    schedule:
      interval: monthly
      day: monday
      time: "07:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, windows-client, zarvis]
