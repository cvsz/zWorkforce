version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /ZWorkforceClient
    schedule:
      interval: monthly
      day: monday
      time: "05:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /packages/zarvis
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /packages/zarvis/apps/zaicoder/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /packages/zarvis/services/zarvis-api
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /packages/zarvis/services/zc
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /packages/zarvis/tools/zctl
    schedule:
      interval: monthly
      day: monday
      time: "06:45"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /packages/zarvis/apps/zarvis-windows
    schedule:
      interval: monthly
      day: monday
      time: "07:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
