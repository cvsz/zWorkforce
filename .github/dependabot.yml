version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
  - package-ecosystem: nuget
    directory: /ZWorkforceClient
    schedule:
      interval: monthly
      day: monday
      time: "05:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels: [dependencies, windows-client]
