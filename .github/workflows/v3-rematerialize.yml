name: Recover v3 source
on:
  push:
    branches: [feat/v3-rematerialize]
permissions:
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      STAGED_TREE_SHA: 5c1b096b0ebf17471c747d557c98c5363cdeb231
      BUNDLE_SHA256: f6e92b2a3efc962dcc4fb5e7cfc773dcf99b0a3ad9daf457c36acfee642b08ef
      BUNDLE_B64_LENGTH: '111448'
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.request
          repo = os.environ['REPOSITORY']; token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp: return json.load(resp)
          tree = api(f"git/trees/{os.environ['STAGED_TREE_SHA']}?recursive=1")['tree']
          entries = {x['path']: x for x in tree if x.get('type') == 'blob'}
          wanted = [f'.v3bundle/part-{i:03d}' for i in range(8)]
          for i in range(8, 18): wanted += [f'.v3bundle/part-{i:03d}-{j:02d}' for j in range(3)]
          wanted += ['.v3bundle/part-018-00', '.v3bundle/part-018-01']
          if len(wanted) != 40: raise SystemExit('invalid whitelist')
          missing = [p for p in wanted if p not in entries]
          if missing: raise SystemExit(f'missing: {missing}')
          encoded = ''.join(base64.b64decode(api(f"git/blobs/{entries[p]['sha']}")['content']).decode('ascii') for p in wanted)
          if len(encoded) != int(os.environ['BUNDLE_B64_LENGTH']): raise SystemExit(f'length mismatch: {len(encoded)}')
          raw = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          if actual != os.environ['BUNDLE_SHA256']: raise SystemExit(f'sha mismatch: {actual}')
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
              for m in tf.getmembers():
                  p = pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk(): raise SystemExit(f'unsafe archive member: {m.name}')
              tf.extractall('.', filter='data')
          scheduler = pathlib.Path('zworkforce/scheduler.py')
          lines = scheduler.read_text().splitlines()
          start = next((i for i, line in enumerate(lines) if line.startswith('def _subset(')), None)
          if start is None: raise SystemExit('scheduler _subset start not found')
          end = len(lines)
          for i in range(start + 1, len(lines)):
              if lines[i] and not lines[i][0].isspace() and (lines[i].startswith('def ') or lines[i].startswith('class ')):
                  end = i; break
          replacement = [
              'def _subset(expected, actual):',
              '    if isinstance(expected, dict):',
              '        return isinstance(actual, dict) and all(k in actual and _subset(v, actual[k]) for k, v in expected.items())',
              '    if isinstance(expected, list):',
              '        if not isinstance(actual, list):',
              '            return False',
              '        return all(any(_subset(item, candidate) for candidate in actual) for item in expected)',
              '    return actual == expected',
              '',
          ]
          scheduler.write_text('\n'.join(lines[:start] + replacement + lines[end:]) + '\n')
          PY
      - name: Validate syntax and package metadata
        run: |
          test "$(python -c 'import zworkforce; print(zworkforce.__version__)')" = "3.0.0"
          python -m compileall -q zworkforce tests
          node --check zworkforce/static/app.js
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('examples').glob('*.json'): json.loads(p.read_text())
          print('v3 candidate syntax validated')
          PY
      - name: Commit candidate source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore .github/workflows
          git add -A
          git commit -m "chore: materialize zWorkforce v3 candidate source"
          git push
