name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify tag, source and main ancestry
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "stable semantic version tag required" >&2; exit 2; }
          python scripts/verify_release.py --expected "$VERSION"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          zworkforce --version

      - name: Generate SBOM and checksums
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_sbom.py --output "dist/zworkforce-${{ steps.meta.outputs.version }}.cdx.json"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zworkforce-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push OCI image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/cvsz/zworkforce:${{ github.ref_name }}
            ghcr.io/cvsz/zworkforce:${{ steps.meta.outputs.version }}
            ghcr.io/cvsz/zworkforce:latest
          provenance: mode=max
          sbom: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "zWorkforce $GITHUB_REF_NAME" \
              --generate-notes
          fi
