[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zworkforce"
version = "1.0.0"
description = "AI Workforce control plane, agent runtime, model router and AI FinOps dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "cvsz"}]
dependencies = []

[project.scripts]
zworkforce = "zworkforce.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
zworkforce = ["static/*.html", "static/*.css", "static/*.js"]
