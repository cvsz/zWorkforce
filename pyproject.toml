[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zworkforce"
version = "2.0.0"
description = "Multi-tenant AI Workforce control plane, durable agent runtime, model router and AI FinOps platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "cvsz"}]
keywords = ["ai", "agents", "workforce", "finops", "llm", "orchestration"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
zworkforce = "zworkforce.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
zworkforce = ["static/*.html", "static/*.css", "static/*.js"]
