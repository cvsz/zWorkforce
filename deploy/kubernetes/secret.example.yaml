apiVersion: v1
kind: Secret
metadata:
  name: zworkforce-secrets
  namespace: zworkforce
type: Opaque
stringData:
  ZWORKFORCE_DATABASE_URL: postgresql://zworkforce:CHANGE_ME@postgres.example.internal:5432/zworkforce?sslmode=require
  ZWORKFORCE_API_KEYS: CHANGE_ME_LONG_RANDOM_SECRET:superadmin:default:cluster-admin:*
  ZWORKFORCE_PROVIDER_API_KEY: ""
  ZWORKFORCE_SKILL_SIGNING_KEY: ""
  ZWORKFORCE_OUTBOX_SIGNING_SECRET: ""
