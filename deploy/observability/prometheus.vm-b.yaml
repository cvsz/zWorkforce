# TEMPLATE / DOCUMENTATION ONLY.
# Production Compose mounts prometheus.rendered.yml, generated by render-config.sh.
# Do not place bearer tokens in this tracked file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alert-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: "zworkforce-vm-a"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["VM_A_HOSTPORT_RENDER_REQUIRED"]
  - job_name: "zworkforce-vm-b"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["VM_B_HOSTPORT_RENDER_REQUIRED"]
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
