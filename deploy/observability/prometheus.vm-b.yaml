global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alert-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: "zworkforce-vm-a"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["${ZWORKFORCE_VM_A_HOSTPORT:-192.168.74.134:9456}"]
    bearer_token: "${ZWORKFORCE_METRICS_BEARER}"
  - job_name: "zworkforce-vm-b"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["${ZWORKFORCE_VM_B_HOSTPORT:-192.168.74.135:9456}"]
    bearer_token: "${ZWORKFORCE_METRICS_BEARER}"
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
